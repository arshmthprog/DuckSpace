[project]
name = "duckspace"
version = "0.1.0"
description = "Open-Source, Local-First AI Development Environment"
requires-python = ">=3.11"
dependencies = [
    "django>=5.0,<6.0",
    "python-dotenv>=1.0",
    "djangorestframework>=3.15",   # فقط برای AJAX/streaming آینده
    "pydantic>=2.6",
    "httpx>=0.27",
    "cryptography>=42.0",          # برای Secret Storage
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "ruff>=0.4",
    "mypy>=1.10",
    "django-stubs>=5.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py"]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
strict = false